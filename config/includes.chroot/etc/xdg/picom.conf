backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -12;

corner-radius = 12;
round-borders = 1;

inactive-opacity = 0.94;
active-opacity = 1.0;
frame-opacity = 0.9;

blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;

fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
